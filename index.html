<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Multilingual AI Readiness Checker</title>
<meta name="description" content="Going global with AI features? Score your i18n readiness: locales, RTL, evals per language, cultural review. Free tool by Zion Tech Group.">
<style>
:root{--bg:#0a1016;--card:#111d2a;--acc:#7dd3fc;--txt:#e8f3fc;--mut:#92abc0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:48px 24px 24px;text-align:center;background:linear-gradient(160deg,#0d2f47,#0a1016)}
h1{margin:0 0 8px}.wrap{max-width:860px;margin:0 auto;padding:24px}
.cat{margin:24px 0 8px;color:var(--acc);font-weight:600;text-transform:uppercase;font-size:.8rem;letter-spacing:.06em}
.item{display:flex;gap:12px;background:var(--card);border:1px solid #1d3348;border-radius:12px;padding:14px;margin:8px 0;align-items:center}
.item input{width:20px;height:20px;accent-color:var(--acc)}
.score{position:sticky;bottom:16px;background:#0e2436;border:1px solid #1d4864;border-radius:14px;padding:16px;text-align:center;font-size:1.2rem;margin-top:24px}
.bar{height:10px;background:#0a1620;border-radius:6px;margin-top:8px;overflow:hidden}.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
footer{padding:32px 24px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid #16283a;margin-top:40px}
footer a{color:var(--acc);text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header><h1>🌍 Zion Multilingual AI Readiness Checker</h1>
<p>English-only evals hide 80% of global failures. Score your AI rollout's i18n readiness across 5 domains.</p></header>
<div class="wrap" id="app"></div>
<footer>Part of the <a href="https://ziontechgroup.com">Zion Tech Group</a> AI apps network ·
<a href="https://ziontechgroup.com/zion-eval-generator/">Eval Generator</a>
<a href="https://ziontechgroup.com/zion-data-readiness-audit/">Data Readiness</a>
<a href="https://ziontechgroup.com/zion-agent-contract-tester/">Contract Tester</a></footer>
<script>
const C={
'Language coverage':['Target locales prioritized by market data, not convenience','Model/embedding language coverage verified per locale','Multilingual embeddings evaluated for retrieval (see Embedding Picker)'],
'UI & formatting':['RTL layout tested (Arabic, Hebrew)','Date/number/currency localization per locale','Font rendering for CJK and Indic scripts','String expansion tested (German +30%, etc.)'],
'Evals per language':['Golden eval sets translated/adapted per locale (not just English)','Quality scores tracked per language','Native-speaker review for top 3 locales'],
'Cultural & legal':['Tone/formality rules per culture (e.g. Japanese keigo)','Content policy reviewed per market','Data-residency requirements mapped (EU, BR, IN, CN)'],
'Fallbacks & ops':['Low-resource-language fallback strategy defined','Support escalation path per locale','Localized refusal/disclaimer messages']};
const app=document.getElementById('app');let html='';
for(const[cat,items]of Object.entries(C)){html+=`<div class="cat">${cat}</div>`+items.map(t=>`<label class="item"><input type="checkbox"><span>${t}</span></label>`).join('');}
html+=`<div class="score"><div>i18n readiness: <b id="pct">0%</b> <span id="v" style="color:var(--mut);font-size:.9rem"></span></div><div class="bar"><div id="fill"></div></div></div>`;
app.innerHTML=html;
app.addEventListener('change',()=>{const b=[...app.querySelectorAll('input')];const p=Math.round(b.filter(x=>x.checked).length/b.length*100);
document.getElementById('pct').textContent=p+'%';document.getElementById('fill').style.width=p+'%';
document.getElementById('v').textContent=p>=85?'— launch globally 🌏':p>=60?'— soft-launch top locales':p>=35?'— pilot 1–2 locales only':'— stay single-language for now';});
</script>
</body>
</html>
